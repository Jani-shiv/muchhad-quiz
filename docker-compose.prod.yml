# Production Docker Compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # ══════════════════════════════════════════════════════════════
  # POSTGRESQL (Primary)
  # ══════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: muchhad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-muchhad_quiz}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - muchhad-internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ══════════════════════════════════════════════════════════════
  # REDIS (Session + Socket.IO Adapter)
  # ══════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: muchhad-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - muchhad-internal
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ══════════════════════════════════════════════════════════════
  # BACKEND (API + Socket.IO)
  # ══════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: muchhad-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PUBLIC_HOST: ${PUBLIC_HOST}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - muchhad-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ══════════════════════════════════════════════════════════════
  # FRONTEND (Static + SSR if needed)
  # ══════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: muchhad-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: https://${PUBLIC_HOST}
      VITE_SOCKET_URL: https://${PUBLIC_HOST}
    depends_on:
      - backend
    networks:
      - muchhad-internal
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ══════════════════════════════════════════════════════════════
  # NGINX (Reverse Proxy + SSL Termination)
  # ══════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: muchhad-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    networks:
      - muchhad-internal
      - muchhad-external
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  muchhad-internal:
    driver: bridge
    internal: true
  muchhad-external:
    driver: bridge

volumes:
  postgres_data:
  redis_data: