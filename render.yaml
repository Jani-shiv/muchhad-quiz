services:
  - type: web
    name: quizblitz
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    port: 4000
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_HOST
        fromService:
          name: quizblitz
          type: web
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: quizblitz-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: quizblitz-redis
          property: url

databases:
  - name: quizblitz-db
    plan: free
    databaseName: quizblitz
    user: quizblitz
    region: oregon

  - name: quizblitz-redis
    plan: free
    region: oregon
    version: 7