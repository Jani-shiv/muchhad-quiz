services:
  # PostgreSQL database
  - type: web
    name: muchhad-quiz
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_HOST
        fromService:
          name: muchhad-quiz
          type: web
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: muchhad-quiz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: muchhad-quiz-redis
          type: keyvalue
          property: connectionString

  # Redis = Key Value service
  - type: keyvalue
    name: muchhad-quiz-redis
    plan: free
    region: oregon
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  # Only PostgreSQL
  - name: muchhad-quiz-db
    plan: free
    databaseName: muchhadquiz
    user: muchhadquiz
    region: oregon