services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: muchhadquiz
      POSTGRES_PASSWORD: muchhadquiz_secret
      POSTGRES_DB: muchhadquiz
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muchhadquiz"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://muchhadquiz:muchhadquiz_secret@postgres:5432/muchhadquiz
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me_in_production_64chars}
      JWT_EXPIRES_IN: 12h
      # Allow all origins for network access - use '*' for any IP/domain
      CORS_ORIGIN: '*'
      # Public host for generating join URLs (set to your LAN IP or domain)
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost:8070}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8070:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - app

volumes:
  pgdata:
  redisdata: