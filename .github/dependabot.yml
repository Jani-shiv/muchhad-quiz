# Dependabot Configuration
# Automated dependency updates for security and maintenance

version: 2
updates:
  # Backend dependencies
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "backend"
      - "automated"
    commit-message:
      prefix: "chore(backend)"
      include: "scope"
    open-pull-requests-limit: 10
    reviewers:
      - "shiv712"
    assignees:
      - "shiv712"
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "typescript*"
          - "vitest*"
          - "@vitest/*"
      production-dependencies:
        patterns:
          - "express*"
          - "socket.io*"
          - "pg*"
          - "ioredis*"
          - "jsonwebtoken*"
          - "bcryptjs*"
          - "zod*"
          - "xss*"
          - "express-rate-limit*"

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "frontend"
      - "automated"
    commit-message:
      prefix: "chore(frontend)"
      include: "scope"
    open-pull-requests-limit: 10
    reviewers:
      - "shiv712"
    assignees:
      - "shiv712"
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "typescript*"
          - "vite*"
          - "@vitejs/*"
          - "vitest*"
          - "@vitest/*"
          - "playwright*"
          - "@playwright/*"
          - "tailwindcss*"
          - "postcss*"
          - "autoprefixer*"
      production-dependencies:
        patterns:
          - "react*"
          - "react-dom*"
          - "react-router*"
          - "framer-motion*"
          - "socket.io-client*"
          - "zod*"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    reviewers:
      - "shiv712"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    reviewers:
      - "shiv712"