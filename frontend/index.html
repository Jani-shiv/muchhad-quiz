<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muchhad-Quiz — Live Neo-Brutalist Quiz Arena</title>
    <link rel="icon" type="image/png" href="/logo.png" sizes="any" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <!-- Google Tag Manager -->
    <% if (import.meta.env.VITE_GTM_ID) { %>
    <script async src="https://www.googletagmanager.com/gtm.js?id=<%= import.meta.env.VITE_GTM_ID %>"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    </script>
    <% } %>
    <!-- End Google Tag Manager -->
  </head>
  <body class="bg-neo-cream text-black antialiased">
    <!-- Google Tag Manager (noscript) -->
    <% if (import.meta.env.VITE_GTM_ID) { %>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=<%= import.meta.env.VITE_GTM_ID %>" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <% } %>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
